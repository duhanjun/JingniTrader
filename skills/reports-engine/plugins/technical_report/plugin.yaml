# 技术分析报告 — 内置报告插件化迁移示范
id: technical_report
label: 技术分析
icon: "📈"
version: "1.0.0"
enabled: true

# 兼容的 report_type 元数据（与内置 technical 报告类型一致）
report_type: technical

# 触发条件：
# - report_intent=technical（旧字段兼容）
# - report_template=technical（显式模板请求，单意图）
# - report_template=both（多命中聚合：与 fundamental_report 联合生成两份报告）
trigger:
  - { field: report_intent, equals: technical }
  - { field: report_template, equals: technical }
  - { field: report_template, equals: both }

# 所需产物：DATA 行情数据
requires:
  - DATA

# 数据契约
data_contract:
  strict: false

# 门户注册
portal:
  enabled: true
  display_order: 10
