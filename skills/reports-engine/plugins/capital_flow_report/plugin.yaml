# 资金流分析报告插件示例（验证插件化机制）
id: capital_flow_report
label: 资金流分析
icon: "💧"
version: "1.0.0"
enabled: true

# 触发条件：用户输入含"资金流/主力资金/北向资金"时触发
trigger:
  - { keyword: ["资金流", "主力资金", "北向资金"] }

# 所需产物：DATA 行情数据
requires:
  - DATA

# 数据契约（宽松校验）
data_contract:
  strict: false

# 门户注册
portal:
  enabled: true
  display_order: 20
