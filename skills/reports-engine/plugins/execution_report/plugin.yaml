# 执行监控报告 — 内置报告插件化迁移
id: execution_report
label: 执行监控
icon: "🎯"
version: "1.0.0"
enabled: true

# 兼容的 report_type 元数据（与 reports-engine 内置 execution 路由返回一致）
report_type: execution

# 触发条件：明确请求执行监控报告时（report_intent=execution）
trigger:
  - { field: report_intent, equals: execution }

# 所需产物：执行监控产物（EXECUTION）
requires:
  - EXECUTION

# 数据契约
data_contract:
  strict: false

# 门户注册
portal:
  enabled: true
  display_order: 50
