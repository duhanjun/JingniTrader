# 因子分析报告 — 自包含插件（阶段 C）
id: factor_analysis_report
label: 因子分析
icon: "🧬"
version: "1.0.0"
enabled: true

# 兼容的 report_type 元数据（与内置 factor_analysis 产物一致）
report_type: factor_analysis

# 触发条件：存在 FACTOR 产物（因子分析报告作为个股分析流程附加产物生成）
# 与 plugins/registry.py::_match_rule 的 artifact 触发契约对齐（{artifact: KEY}）。
trigger:
  - artifact: FACTOR

# 所需产物：因子数据
requires:
  - FACTOR

# 数据契约
data_contract:
  strict: false

# 门户注册
portal:
  enabled: true
  display_order: 70
