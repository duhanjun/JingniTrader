[pytest]
# 单一权威 pytest 配置（原根 pytest.ini 与 tests/pytest.ini 并存，导致 unit/contract/
# integration 等 marker 仅在后者注册，全量运行触发 PytestUnknownMarkWarning）。
# 现合并为单一文件，注册全部 marker，并保留全局超时护栏与默认测试路径。
# CI 已按 marker 分批执行（quick/full/heavy）。
markers =
    # 按子 Skill 划分
    skill_master: 主调度器（engine.py + scripts/）测试
    skill_data_engine: data-engine 测试
    skill_factor_engine: factor-engine 测试
    skill_strategy_model_engine: strategy-model-engine 测试
    skill_backtest_engine: backtest-engine 测试
    skill_portfolio_risk_engine: portfolio-risk-engine 测试
    skill_execution_monitor_engine: execution-monitor-engine 测试
    skill_reports_engine: reports-engine 测试

    # 按测试层级划分
    contract: L1 契约测试（验证 run(ctx) 接口契约）
    unit: L2 单元测试（skill 内部模块）
    integration: L3 集成测试（跨 skill 真实对接）

    # 按运行特性划分
    slow: 慢测试（>5s）
    heavy: 重型计算测试（cvxpy/pypfopt/原生扩展），CI 分批执行，易触发原生线程竞态
    requires_network: 需要网络访问
    requires_sklearn: 需要 scikit-learn 真实安装
    requires_polars: 需要 polars 真实安装
    requires_tushare_token: 需要 TUSHARE_TOKEN
    requires_gm_token: 需要 GM_TOKEN（掘金量化）
    requires_wind_terminal: 需要 Wind 金融终端
    requires_ifind_credentials: 需要同花顺 iFinD 账号密码
    requires_xtquant: 需要迅投 QMT/xtp 本地客户端
    requires_alphalens: 需要 alphalens-reloaded，且原生计算可能挂起，需配合超时护栏
    requires_node: 需要 Node.js 运行时

# 默认测试路径（合并自原 tests/pytest.ini）
testpaths = tests

# 输出格式（合并自原 tests/pytest.ini）
#
# 默认跑安全子集：heavy（原生计算栈易触发线程竞态）+ 各类 requires_* 依赖标记
# 一律排除，裸 `pytest` 不会加载原生扩展。heavy 批次由 CI 的 heavy-regression
# job 以「目录分批 + 单进程」隔离执行（见 .github/workflows/ci.yml，
# OPEN-2026-0827-15 / OPEN-2026-0814-13 遗留闭环）。
addopts = -ra -m "not heavy and not requires_network and not requires_node and not requires_tushare_token and not requires_sklearn and not requires_alphalens and not requires_polars and not requires_gm_token and not requires_wind_terminal and not requires_ifind_credentials and not requires_xtquant"

# 全局超时护栏：任何单测超过 120s 即判定失败，防止 alphalens/重型原生计算挂起
# 拖垮整个 CI 套件（配合 alphalens_adapter 内的进程级超时双保险）
timeout = 120
timeout_method = thread
