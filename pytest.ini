[pytest]
# 注册自定义标记，避免 unknown-marker 警告；CI 已按 marker 分批执行
markers =
    slow: 耗时较长的测试
    heavy: 重型计算测试（cvxpy/pypfopt/原生扩展），CI 分批执行，易触发原生线程竞态
    requires_network: 需要联网/外部数据源
    requires_tushare_token: 需要 TUSHARE_TOKEN
    requires_gm_token: 需要 GM_TOKEN（掘金量化）
    requires_wind_terminal: 需要 Wind 金融终端
    requires_ifind_credentials: 需要同花顺 iFinD 账号密码
    requires_xtquant: 需要迅投 QMT/xtp 本地客户端
    requires_alphalens: 需要 alphalens-reloaded，且原生计算可能挂起，需配合超时护栏
    requires_polars: 需要 polars 后端
    requires_sklearn: 需要 scikit-learn
    skill_master: 主调度器相关
    skill_data_engine: data-engine 相关
    skill_factor_engine: factor-engine 相关
    skill_strategy_model_engine: strategy-model-engine 相关
    skill_backtest_engine: backtest-engine 相关
    skill_portfolio_risk_engine: portfolio-risk-engine 相关
    skill_execution_monitor_engine: execution-monitor-engine 相关
    skill_reports_engine: reports-engine 相关

# 全局超时护栏：任何单测超过 120s 即判定失败，防止 alphalens/重型原生计算挂起
# 拖垮整个 CI 套件（配合 alphalens_adapter 内的进程级超时双保险）
timeout = 120
timeout_method = thread
