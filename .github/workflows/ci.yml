name: CI

# jingni-trader skill 持续集成
# 分层执行：
#   - 快速回归（每次 push/PR）：L0 契约 + L2 单元 + 主调度器/意图解析（无需网络、无需真实第三方库）
#   - 完整回归（schedule + 手动）：全部非网络测试，按子 skill 维度分组
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # 每天 UTC 02:00 完整回归
    - cron: '0 2 * * *'
  workflow_dispatch: {}

jobs:
  quick-regression:
    name: 快速回归 (fast, no network)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.11']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: 安装轻量依赖（仅测试必需）
        run: |
          pip install --upgrade pip
          pip install pytest pytest-cov pyyaml
          # 核心数据处理依赖（测试 fixture 需要 pandas/numpy/pyarrow 生成合成数据）
          pip install "pandas>=2.0.0" "numpy>=1.24.0" "pyarrow>=10.0.0"

      - name: L0/L1/L2 快速回归（排除 slow / heavy / requires_network / 需真实库）
        run: |
          pytest tests \
            -m "not slow and not heavy and not requires_network and not requires_tushare_token and not requires_gm_token and not requires_wind_terminal and not requires_ifind_credentials and not requires_xtquant and not requires_alphalens and not requires_polars and not requires_sklearn" \
            --cov=engine \
            --cov=scripts \
            --cov-report=term-missing \
            -q

      - name: 主调度器与意图解析专项（skill 核心路由）
        run: |
          pytest tests/master -m "not slow and not requires_network" -q

  full-regression:
    name: 完整回归 (full, per-skill)
    runs-on: ubuntu-latest
    needs: quick-regression
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安装完整依赖
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-timeout

      - name: 按子 skill 维度分组测试（排除 heavy，由独立批次执行）
        run: |
          set -e
          for marker in skill_master skill_data_engine skill_factor_engine skill_strategy_model_engine skill_backtest_engine skill_portfolio_risk_engine skill_execution_monitor_engine skill_reports_engine; do
            echo "===== marker: ${marker} ====="
            pytest tests -m "${marker} and not requires_network and not slow and not heavy" -q || exit 1
          done

      - name: 集成 / 端到端（合成数据，无网络，排除 heavy）
        run: |
          pytest tests/integration -m "not requires_network and not slow and not heavy" -q

      - name: 上传覆盖率报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: .coverage
          if-no-files-found: ignore

  heavy-regression:
    name: 重型计算回归 (heavy, 目录分批 + 单进程隔离)
    runs-on: ubuntu-latest
    needs: quick-regression
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        # heavy 用例实测集中于这 4 个目录（OPEN-2026-0814-13 遗留）：
        #   integration/ 7 个文件、master/ 4 个、factor_engine/ 1 个、
        #   portfolio_risk_engine/ 2 个（test_circuit_breaker / test_run_contract）
        # 按目录拆成独立 job，每个 job 内 -p no:randomly 单进程串行执行，
        # 使 cvxpy/lightgbm/gm 等原生扩展不共进程，消除线程竞态导致的
        # access violation / 段错误。fail-fast: false，任一目录失败不影响其余目录结果。
        # 注意：portfolio_risk_engine 此前漏配，导致该目录 heavy 用例在 CI 上无执行批次，
        #       本地默认子集与 CI 快速回归又均排除 heavy —— 形成覆盖盲区（2026-08-28 补入）。
        batch:
          - tests/integration
          - tests/master
          - tests/factor_engine
          - tests/portfolio_risk_engine
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安装完整依赖
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-timeout

      - name: 安装进程隔离插件（xdist，用于 --dist=each 兜底分批）
        run: pip install pytest-xdist

      - name: 重型计算测试 — ${{ matrix.batch }}（单进程串行，进程级隔离）
        id: heavy
        env:
          # 单线程 BLAS/OpenMP：抑制原生栈多线程竞态
          OMP_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
        run: |
          set -e
          set -o pipefail
          echo "===== heavy batch: ${{ matrix.batch }} ====="
          # -p no:randomly：禁用随机顺序，保证原生库加载顺序确定
          # --timeout=120 --timeout-method=thread：单用例超时护栏
          # -x 不启用：允许同批次内多用例失败一次暴露全貌
          # 阻断模式（2026-08-28 改，Damon 批准方案 A）：set -e 生效，
          # pytest 非零退出直接终止本 step 并使本 job 失败，不再 continue-on-error。
          pytest "${{ matrix.batch }}" \
            -m "heavy and not requires_network" \
            -p no:randomly \
            --timeout=120 --timeout-method=thread \
            -q -ra
          echo "批次 ${{ matrix.batch }} 执行结束"

      # 阻断模式（2026-08-28 改，Damon 批准方案 A）：上一步 pytest 非零退出 →
      # set -e 直接终止 step → 本 job 失败，不再 continue-on-error 观测。
      # 注：此处用 steps.heavy.outcome（同一 job 内已执行 step 的真实结果），
      #     不可用 ${{ job.status }} —— 后者在 step 进入前即完成插值，恒为 success。
      - name: 汇总批次结论（阻断模式：失败即 job 失败）
        if: always()
        run: |
          if [ "${{ steps.heavy.outcome }}" != "success" ]; then
            echo "::error::heavy 批次 ${{ matrix.batch }} 存在失败用例（阻断模式，已使本 job 失败）"
            exit 1
          fi
          echo "heavy 批次 ${{ matrix.batch }} 全部通过"

  # 三方一致性校验：主目录 ↔ 仓库副本 ↔ GitHub（OPEN-2026-0827-12）
  # 副本为单一权威源（OPEN-2026-0827-05），此 job 在 CI 侧校验受保护资产
  # 未被反向覆盖、版本库未混入运行时产物。副本路径在 CI 环境不存在时自动跳过。
  sync-consistency:
    name: 三方一致性校验 (sync drift detection)
    runs-on: ubuntu-latest
    needs: quick-regression
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 运行三方一致性校验（零新依赖，纯标准库）
        run: python scripts/check_sync_consistency.py
